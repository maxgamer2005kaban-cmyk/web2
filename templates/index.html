<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap (Локальный файл)</title>
    <!-- Путь к CSS относительно папки templates -->
    <link rel="stylesheet" href="../static/css/bootstrap.min.css">
</head>

<body>
    <div class="container mt-5">
        <!-- Сетка -->
        <div class="row mb-5">
            <div class="col-4"
                style="background-color: red; height: 100px; color: white; display: flex; align-items: center; justify-content: center;">
                First
            </div>
            <div class="col-4"
                style="background-color: green; height: 100px; color: white; display: flex; align-items: center; justify-content: center;">
                Second
            </div>
            <div class="col-4"
                style="background-color: blue; height: 100px; color: white; display: flex; align-items: center; justify-content: center;">
                Third
            </div>
        </div>

        <!-- Пример Аккордеона -->
        <h3 class="mb-3">Проверка Bootstrap JS (Аккордеон)</h3>
        <div class="accordion" id="accordionExample">
            <div class="accordion-item">
                <h2 class="accordion-header" id="headingOne">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                        Элемент аккордеона #1
                    </button>
                </h2>
                <div id="collapseOne" class="accordion-collapse collapse show" aria-labelledby="headingOne"
                    data-bs-parent="#accordionExample">
                    <div class="accordion-body">
                        Теперь это работает даже если открыть файл просто двойным кликом!
                    </div>
                </div>
            </div>
            <div class="accordion-item">
                <h2 class="accordion-header" id="headingTwo">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                        Элемент аккордеона #2
                    </button>
                </h2>
                <div id="collapseTwo" class="accordion-collapse collapse" aria-labelledby="headingTwo"
                    data-bs-parent="#accordionExample">
                    <div class="accordion-body">
                        Bootstrap JS подключен через относительный путь.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Путь к JS относительно папки templates -->
    <script src="../static/js/bootstrap.bundle.min.js"></script>
</body>

</html>
